<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello World</title>
  <style>
    body {
      margin: 0; padding: 24px; font-family: monospace;
      background: #020617; color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    h1 { color: #22d3ee; font-size: 28px; margin: 0; }
    button {
      padding: 8px 16px; background: #0891b2; color: white;
      border: none; font: inherit; cursor: pointer; border-radius: 2px;
    }
    button:hover { background: #06b6d4; }
    #count { color: #34d399; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Hello World! (a test BoxOS app)</h1>
  <p>Clicks: <span id="count">0</span></p>
  <button id="btn">Click me<!/button>

  <script>
    let n = 0;
    const count = document.getElementById("count");
    document.getElementById("btn").addEventListener("click", () => {
      n++;
      count.textContent = n;
    });
  </script>
</body>
</html>
